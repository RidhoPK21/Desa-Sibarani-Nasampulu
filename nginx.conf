server {
    listen 80;
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 50M;

    set $cors_origin "http://localhost:5173";

    # 1. Auth Service
    location /api/auth/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Perhatikan: Hapus /api/ di akhir agar Laravel menerima path utuh atau sesuaikan
        # Kita gunakan rewrite untuk memastikan path bersih
        rewrite ^/api/auth/(.*)$ /api/$1 break;

        proxy_pass http://auth-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header 'Access-Control-Allow-Origin';
    }

    # 2. Info Service
    location /api/info/ {
        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
        rewrite ^/api/info/(.*)$ /api/$1 break;
        proxy_pass http://info-service:8001;
        proxy_set_header Host $host;
        proxy_hide_header 'Access-Control-Allow-Origin';
    }

    # 3. Statistic Service
    location /api/statistic/ {
        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
        rewrite ^/api/statistic/(.*)$ /api/$1 break;
        proxy_pass http://statistic-service:8002;
        proxy_set_header Host $host;
        proxy_hide_header 'Access-Control-Allow-Origin';
    }

    # 4. Content Service
    location /api/content/ {
        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
        rewrite ^/api/content/(.*)$ /api/$1 break;
        proxy_pass http://content-service:8003;
        proxy_set_header Host $host;
        proxy_hide_header 'Access-Control-Allow-Origin';
    }

    location /storage/ {
        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
        proxy_pass http://info-service:8001/storage/;
        proxy_set_header Host $host;
    }
}
