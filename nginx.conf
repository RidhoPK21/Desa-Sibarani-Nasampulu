server {
    listen 80;

    # ========================================================
    # 🌟 SOLUSI ERROR 413: Izinkan Upload File sampai 50 MB
    # ========================================================
    client_max_body_size 50M;

    # 1. Pintu masuk ke Auth Service
    location /api/auth/ {
        proxy_pass http://auth-service:8000/api/;
        proxy_set_header Host $http_host; # <--- UBAH DI SINI
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Pintu masuk ke Info Service (Berita dll)
    location /api/info/ {
        proxy_pass http://info-service:8001/api/;
        proxy_set_header Host $http_host; # <--- UBAH DI SINI
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Pintu masuk ke Statistic Service
    location /api/statistic/ {
        proxy_pass http://statistic-service:8002/api/;
        proxy_set_header Host $http_host; # <--- UBAH DI SINI
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Pintu masuk ke Content Service
    location /api/content/ {
        proxy_pass http://content-service:8003/api/;
        proxy_set_header Host $http_host; # <--- UBAH DI SINI
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. Pintu masuk khusus untuk mengambil Gambar/File di Info Service (SERVE STATIC FILES)
    location /storage/ {
        proxy_pass http://info-service:8001/storage/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        # 🔥 TAMBAHKAN INI UNTUK FIX CORS DI BROWSER
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        # Cache static files untuk performa
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 6. Pintu masuk khusus untuk Banner di Content Service 🔥
    location /storage/banner_images/ {
        proxy_pass http://content-service:8003/storage/banner_images/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
}